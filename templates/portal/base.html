<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Portal{% endblock %} – Medsel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#1a3a5c;--med:#2563a8;--cl:#3b82c4;--ciano:#0ea5d4;
  --verde:#10b981;--cinza:#f0f4f8;--bd:#dbe4ef;--txt:#64748b;
  --branco:#fff;--perigo:#ef4444;--r:10px;
  --s:0 2px 12px rgba(26,58,92,.09);--sl:0 8px 32px rgba(26,58,92,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cinza);color:var(--azul);min-height:100vh}
a{text-decoration:none;color:inherit}
/* header */
#hd{background:var(--azul);color:#fff;display:flex;align-items:center;
    justify-content:space-between;padding:0 24px;height:58px;
    position:sticky;top:0;z-index:100;box-shadow:var(--sl)}
.logo{font-family:'DM Serif Display',serif;font-size:1.2rem;display:flex;align-items:center;gap:8px}
.logo span{color:var(--ciano)}
.hd-adm{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);
  color:#fff;padding:5px 14px;border-radius:6px;font-size:.8rem;cursor:pointer}
.hd-adm:hover{background:rgba(255,255,255,.22)}
/* wrap */
#wrap{display:flex;min-height:calc(100vh - 58px)}
/* sidebar */
#sb{width:245px;flex-shrink:0;background:var(--branco);
    border-right:1px solid var(--bd);
    position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;padding:12px 0}
.sb-srch{padding:8px 12px 10px}
.sb-srch input{width:100%;border:1.5px solid var(--bd);border-radius:8px;
  padding:7px 11px;font-size:.82rem;font-family:inherit;outline:none;background:#fafcff;color:var(--azul)}
.sb-srch input:focus{border-color:var(--cl)}
.sb-grp{margin-bottom:1px}
.sb-cat{display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;font-size:.77rem;font-weight:600;color:var(--txt);
  text-transform:uppercase;letter-spacing:.08em;cursor:pointer;user-select:none}
.sb-cat:hover{color:var(--azul)}
.sb-cat .arr{font-size:.6rem;transition:transform .2s}
.sb-cat.open .arr{transform:rotate(90deg)}
.sb-links{display:none}
.sb-links.open{display:block}
.sb-lnk{display:block;padding:7px 14px 7px 24px;font-size:.855rem;
  color:#334155;border-left:3px solid transparent;transition:all .12s}
.sb-lnk:hover{background:#eef3fb;color:var(--med)}
.sb-lnk.on{background:#e8f0fc;color:var(--med);border-left-color:var(--med);font-weight:500}
/* content */
#ct{flex:1;padding:28px 32px;overflow-y:auto;min-width:0}
/* breadcrumb */
.bc{font-size:.77rem;color:var(--txt);margin-bottom:14px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.bc a:hover{color:var(--med)}
/* page content */
.page-content{background:var(--branco);border-radius:var(--r);border:1px solid var(--bd);padding:28px 32px;line-height:1.75}
.page-content h1,.page-content h2,.page-content h3{margin:1em 0 .5em;color:var(--azul);font-family:'DM Serif Display',serif}
.page-content h1{font-size:1.7rem}.page-content h2{font-size:1.35rem}.page-content h3{font-size:1.1rem}
.page-content p{margin-bottom:.85em}
.page-content ul,.page-content ol{margin:.5em 0 .85em 1.4em}
.page-content li{margin-bottom:.3em}
.page-content table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.88rem}
.page-content td,.page-content th{border:1px solid var(--bd);padding:8px 12px;text-align:left}
.page-content th{background:var(--cinza);font-weight:600;color:var(--azul)}
.page-content tr:hover td{background:#fafcff}
.page-content img{max-width:100%;border-radius:8px;margin:8px 0}
.page-content a{color:var(--med);text-decoration:underline}
.page-content blockquote{border-left:4px solid var(--cl);padding:.5em 1em;
  background:#f0f6ff;margin:1em 0;border-radius:0 6px 6px 0;color:#334155}
.page-content pre{background:#1e293b;color:#e2e8f0;padding:14px 18px;
  border-radius:8px;overflow-x:auto;font-size:.82rem;margin:1em 0}
.page-content code{background:#f1f5f9;padding:2px 5px;border-radius:4px;font-size:.85em}
.page-content pre code{background:transparent;padding:0}
.page-content hr{border:none;border-top:2px solid var(--bd);margin:1.5em 0}
/* attachments */
.attach-list{margin-top:24px;padding-top:18px;border-top:2px solid var(--bd)}
.attach-list h3{font-size:.9rem;font-weight:600;color:var(--txt);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.attach-grid{display:flex;flex-direction:column;gap:8px}
.attach-item{display:flex;align-items:center;gap:12px;
  background:var(--cinza);border-radius:8px;padding:10px 14px;
  border:1px solid var(--bd);transition:box-shadow .15s}
.attach-item:hover{box-shadow:var(--s)}
.attach-icon{font-size:1.4rem;flex-shrink:0}
.attach-info{flex:1;min-width:0}
.attach-name{font-size:.875rem;font-weight:500;color:var(--azul)}
.attach-meta{font-size:.73rem;color:var(--txt);margin-top:1px}
.attach-dl{background:var(--med);color:#fff;padding:5px 14px;
  border-radius:6px;font-size:.78rem;font-weight:500;white-space:nowrap}
.attach-dl:hover{background:var(--azul)}
@media(max-width:700px){#sb{display:none}#ct{padding:14px}}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<div id="hd">
  <a class="logo" href="/">🏥 Portal <span>Informações</span></a>
  <a class="hd-adm" href="/admin">⚙ Admin</a>
</div>
<div id="wrap">
  <div id="sb">
    <div class="sb-srch">
      <input type="text" placeholder="🔍 Buscar..." oninput="filterSb(this.value)">
    </div>
    <div id="sbmenu">
      {% for s in sections %}
      <div class="sb-grp" data-name="{{ s.name|lower }}">
        <div class="sb-cat {% if cur_section and cur_section.id==s.id %}open{% endif %}"
             onclick="toggleCat(this)">
          <span>{{ s.icon }} {{ s.name }}</span><span class="arr">▶</span>
        </div>
        <div class="sb-links {% if cur_section and cur_section.id==s.id %}open{% endif %}">
          <a class="sb-lnk {% if cur_section and cur_section.id==s.id and not cur_page %}on{% endif %}"
             href="/s/{{ s.slug }}">Todas as páginas</a>
          {% for p in s.pages %}{% if p.active %}
          <a class="sb-lnk {% if cur_page and cur_page.id==p.id %}on{% endif %}"
             href="/p/{{ p.id }}">{{ p.title }}</a>
          {% endif %}{% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  <div id="ct">{% block content %}{% endblock %}</div>
</div>
<script>
function toggleCat(el){el.classList.toggle('open');el.nextElementSibling.classList.toggle('open')}
function filterSb(v){v=v.toLowerCase();document.querySelectorAll('.sb-grp').forEach(g=>{g.style.display=g.dataset.name.includes(v)?'':'none'})}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
