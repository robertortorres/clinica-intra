<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Portal Medsel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#1a3a5c;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border-radius:16px;padding:42px 38px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.ico{font-size:2.3rem;margin-bottom:10px}
h1{font-family:'DM Serif Display',serif;font-size:1.65rem;color:#1a3a5c;margin-bottom:3px}
.sub{color:#64748b;font-size:.83rem;margin-bottom:28px}
.fg{text-align:left;margin-bottom:14px}
.fg label{display:block;font-size:.8rem;font-weight:600;color:#1a3a5c;margin-bottom:5px}
.fg input{width:100%;border:1.5px solid #dbe4ef;border-radius:8px;padding:11px 13px;font-size:.9rem;font-family:inherit;outline:none;transition:border-color .15s}
.fg input:focus{border-color:#3b82c4}
.err{background:#fef2f2;color:#ef4444;border-radius:8px;padding:8px 13px;font-size:.82rem;margin-bottom:14px;text-align:left}
.btn{width:100%;background:#2563a8;color:#fff;border:none;border-radius:8px;padding:13px;font-size:.93rem;font-weight:600;cursor:pointer;transition:background .2s;margin-top:4px}
.btn:hover{background:#1a3a5c}
.back{margin-top:16px;font-size:.78rem;color:#64748b}
.back a{color:#2563a8}
</style>
</head>
<body>
<div class="box">
  <div class="ico">🔐</div>
  <h1>Painel Admin</h1>
  <div class="sub">Portal Informações – Medsel</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <div class="fg"><label>Usuário</label><input type="text" name="username" autofocus required placeholder="admin"></div>
    <div class="fg"><label>Senha</label><input type="password" name="password" required placeholder="••••••"></div>
    <button class="btn" type="submit">Entrar no Painel</button>
  </form>
  <div class="back"><a href="/">← Voltar ao Portal</a></div>
</div>
</body>
</html>
